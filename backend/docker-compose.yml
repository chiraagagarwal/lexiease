services:
  postgres:
    image: postgres:16
    container_name: lexiease-postgres
    environment:
      POSTGRES_USER: lexiease
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: lexiease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiease"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lexiease-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: